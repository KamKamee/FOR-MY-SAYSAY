<!DOCTYPE html> 
<html>
  <head>
    <title>Sorry</title>
    <link rel="stylesheet" href="style.css">
     <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body>
    <div class="container">  
      <div class="valentines">
        <div class="envelope"></div>
        <div class="front"></div>
        <div class="card">
          <div class="text">
            Hey babe, im very sorry for my mistake. I know im too dumb to know the difference between accountancy and marketing. Dont worry because I will never do the same mistake again. 
          </div>
          <div class="heart"></div> <!-- Corrected here -->
        </div>
        <div class="hearts">
          <div class="one"></div>
          <div class="two"></div>
          <div class="three"></div>
          <div class="four"></div>
          <div class="five"></div>
        </div>
      </div>
      <div class="shadow"></div>
    </div>

   <div class="audio-container">
  <iframe 
    width="0" 
    height="0" 
    src="https://youtu.be/Lg73px9riHA?si=mYm9W9-fgskPaQd9" 
    frameborder="0" 
    allow="autoplay; encrypted-media" 
    allowfullscreen>
  </iframe>
</div>

    
    <script>
      $(document).ready(function () {
    $('.container').mouseenter(function () {
        $('.card').stop().animate({
            top: '-90px'
        }, 'slow');
    }).mouseleave(function () {
        $('.card').stop().animate({
            top: 0
        }, 'slow');
    });
});
    </script>
    
  </body>
</html>
